# RAG Document Q&A - Docker Compose Configuration
# For homelab deployment on Ubuntu Server

services:
  # Ollama Service
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "/health-check.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rag-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    # ports:
    #   - "8000:8000"
    environment:
      # For containerized Ollama
      - OLLAMA_HOST=${OLLAMA_HOST:-http://rag-ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - UPLOAD_DIRECTORY=/app/data/uploads
    volumes:
      # Persist ChromaDB data
      - chroma_data:/app/data/chroma
      # Persist uploaded documents
      - uploads_data:/app/data/uploads
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rag-network

  # Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://rag-backend:8000/api}
    container_name: rag-frontend
    restart: unless-stopped
    # ports:
    #   - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - rag-network

# Named volumes for data persistence
volumes:
  ollama_data:
    driver: local
  chroma_data:
    driver: local
  uploads_data:
    driver: local

# Docker network
networks:
  rag-network:
    driver: bridge
