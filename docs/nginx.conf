server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Handle requests with /docs prefix by stripping it
    location /docs/ {
        alias /usr/share/nginx/html/;
        try_files $1 $1/ $1.html $1/index.html /index.html;
    }

    # Regex location to capture the path after /docs/
    location ~ ^/docs/(.*)$ {
        try_files /$1 /$1/ /$1.html /$1/index.html /index.html;
    }

    # Main location block for MkDocs (fallback for requests without /docs prefix)
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable logging for favicon and robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf font/opentype image/svg+xml image/x-icon;
}