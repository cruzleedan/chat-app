site_name: RAG Document Q&A
site_description: A full-stack Retrieval-Augmented Generation application for document Q&A
site_author: Your Name
site_url: ${VITE_DOCS_URL}

docs_dir: content

repo_name: rag-research
repo_url: https://github.com/yourusername/rag-research

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - What is RAG?: rag-case-study.md
  - Architecture:
      - Overview: architecture/overview.md
      - Tech Stack: architecture/tech-stack.md
      - Design Patterns: architecture/design-patterns.md
      - Data Flow: architecture/data-flow.md
  - Backend:
      - Overview: backend/overview.md
      - Document Processing: backend/document-processing.md
      - Vector Store: backend/vector-store.md
      - RAG Pipeline: backend/rag-pipeline.md
  - Frontend:
      - Overview: frontend/overview.md
      - Components: frontend/components.md
      - State Management: frontend/state-management.md
  - API Reference:
      - Overview: api/overview.md
      - Documents API: api/documents.md
      - Chat API: api/chat.md
      - Conversations API: api/conversations.md
  - Deployment:
      - Local Setup: deployment/local-setup.md
      - Production: deployment/production.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/rag-research
